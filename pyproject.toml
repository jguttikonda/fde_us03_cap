[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-us03-cap"
version = "0.1.0"
description = "Advisory-only Aircraft-on-Ground recovery decision support foundation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-adk>=2,<3",
    "mcp>=1,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
warn_unused_configs = true
packages = ["aog_recovery"]
